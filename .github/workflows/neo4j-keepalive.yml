name: Neo4j Keep-Alive

on:
  schedule:
    - cron: "0 6 */2 * *"
  workflow_dispatch:

jobs:
  keepalive:
    name: Neo4j Keep-Alive
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install neo4j package
        run: pip install neo4j

      - name: Run Neo4j Keepalive
        env:
          NEO4J_URI: ${{ secrets.NEO4J_URI }}
          NEO4J_USERNAME: ${{ secrets.NEO4J_USERNAME }}
          NEO4J_PASSWORD: ${{ secrets.NEO4J_PASSWORD }}
        run: |
          python -c "import os; from neo4j import GraphDatabase; driver = GraphDatabase.driver(os.environ['NEO4J_URI'], auth=(os.environ['NEO4J_USERNAME'], os.environ['NEO4J_PASSWORD'])); driver.session().run('RETURN 1').single(); driver.close(); print('keepalive ok')"

